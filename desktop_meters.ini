X=(#BaseX# + #ContainerPad# + 8)
Y=(#BaseY# + #ContainerPad# + 85)
Shape=Rectangle 0,0,24,35,2 | Fill Color #CoreBarTrackColour# | StrokeWidth 0
Shape2=Rectangle 30,0,24,35,2 | Fill Color #CoreBarTrackColour# | StrokeWidth 0
Shape3=Rectangle 60,0,24,35,2 | Fill Color #CoreBarTrackColour# | StrokeWidth 0
Shape4=Rectangle 90,0,24,35,2 | Fill Color #CoreBarTrackColour# | StrokeWidth 0
Shape5=Rectangle 120,0,24,35,2 | Fill Color #CoreBarTrackColour# | StrokeWidth 0
