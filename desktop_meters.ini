LineColor=#MemoryPrimaryColour#
LineColor2=#MemorySecondaryPrimaryColour#

[MeterMemoryLabel]
Meter=String
X=(#BaseX# + #ContainerPad# + (#MemoryGraphColumn# * (#TileW# + #Gap#)) + 12)
