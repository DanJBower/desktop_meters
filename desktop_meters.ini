[Rainmeter]
Update=1000
AccurateText=1
DynamicWindowSize=1

[Metadata]
Name=Desktop Metres
Author=DanJBower
Information=Shows task manager like stats
Version=0.04
License=MIT





; Variables

[Variables]
; L&F
BaseX=0
BaseY=0

ContainerPad=2
Gap=6
GraphCornerRadius=6
BackgroundColour=22,28,36,255

TileW=154
TileH=242

Columns=4
TileCount=4

; 0 = Visible, 1 = Hidden
GraphFillsHidden=1

DetailFontSize=9
DetailTrackColour=48,61,72,255
DetailTextColour=230,235,240,255
CoreBarTrackColour=39,51,61,255

; The current GPU exports usage as a percentage, so its capacity is configured
; here for the "used / total" display. 16 GiB = 17179869184 bytes.
VramTotalBytes=17179869184



CpuGraphColumn = 0
CpuPrimaryColour=70,150,190,255
CpuFillColour=49,97,129,255

DriveGraphColumn = 1
DrivePrimaryColour=190,80,193,255
DriveFillColour=112,60,125,255

GpuGraphColumn = 2
GpuPrimaryColour=80,200,120,255
GpuFillColour=42,124,44,255

MemoryGraphColumn = 3
MemoryPrimaryColour=197,129,13,255
MemorySecondaryPrimaryColour=190,80,193,255
MemoryFillColour=116,87,30,255
MemorySecondaryFillColour=112,60,125,255
MemoryBothFillColour=0,70,70,255

; Sensor indexes
PhysMemLoadIndex=0

CpuCore0T0UsageIndex=1
CpuCore0T1UsageIndex=2
CpuCore1T0UsageIndex=3
CpuCore1T1UsageIndex=4
CpuCore2T0UsageIndex=5
CpuCore2T1UsageIndex=6
CpuCore3T0UsageIndex=7
CpuCore3T1UsageIndex=8
CpuCore4T0UsageIndex=9
CpuCore4T1UsageIndex=10
CpuCore5T0UsageIndex=11
CpuCore5T1UsageIndex=12
CpuCore6T0UsageIndex=13
CpuCore6T1UsageIndex=14
CpuCore7T0UsageIndex=15
CpuCore7T1UsageIndex=16
CpuTotalUsageIndex=17

CpuDieAvgTempIndex=18
CpuPackagePowerIndex=19

SsdTotalUsageIndex=20
SsdReadRateIndex=21
SsdWriteRateIndex=22

GpuTempIndex=23
GpuPowerIndex=24
; GPU Core Load = GPU Usage
GpuCoreLoadIndex=25
GpuMemUsageIndex=26

WifiDlRateIndex=27
WifiUpRateIndex=28





; Measures

; --- Physical Memory Load
[MeasurePhysMemLoadValue]
Measure=Registry
RegHKey=HKEY_CURRENT_USER
RegKey=SOFTWARE\HWiNFO64\VSB
RegValue=Value#PhysMemLoadIndex#

[MeasurePhysMemLoadValueRaw]
Measure=Registry
RegHKey=HKEY_CURRENT_USER
RegKey=SOFTWARE\HWiNFO64\VSB
RegValue=ValueRaw#PhysMemLoadIndex#
MinValue=0
MaxValue=100
AverageSize=6

