; --- Numeric display values for REG_SZ-backed HWiNFO measures
[MeasureCpuTotalUsageDisplay]
Measure=Calc
Formula=[MeasureCpuTotalUsageValueRaw]
DynamicVariables=1

[MeasureCpuDieAvgTempDisplay]
Measure=Calc
Formula=[MeasureCpuDieAvgTempValueRaw]
DynamicVariables=1

[MeasureSsdTotalUsageDisplay]
Measure=Calc
Formula=[MeasureSsdTotalUsageValueRaw]
DynamicVariables=1

[MeasureGpuCoreLoadDisplay]
Measure=Calc
Formula=[MeasureGpuCoreLoadValueRaw]
DynamicVariables=1

[MeasureGpuTempDisplay]
Measure=Calc
Formula=[MeasureGpuTempValueRaw]
DynamicVariables=1

; --- RAM used and total (bytes)
[MeasureRamUsedBytes]
Measure=PhysicalMemory
AverageSize=6

[MeasureRamTotalBytes]
Measure=PhysicalMemory
Total=1
UpdateDivider=-1

; --- VRAM used (bytes), derived from the averaged percentage
[MeasureVramUsedBytes]
Measure=Calc
Formula=([MeasureGpuMemUsageValueRaw] / 100) * #VramTotalBytes#
DynamicVariables=1

; --- Transfer rates converted to bits per second
[MeasureSsdReadBits]
Measure=Calc
Formula=[MeasureSsdReadRateValueRaw] * 8000000
DynamicVariables=1

[MeasureSsdWriteBits]
Measure=Calc
Formula=[MeasureSsdWriteRateValueRaw] * 8000000
DynamicVariables=1

[MeasureWifiDlBits]
Measure=Calc
Formula=[MeasureWifiDlRateValueRaw] * 8000
MinValue=0
MaxValue=750000000
DynamicVariables=1

[MeasureWifiUpBits]
Measure=Calc
Formula=[MeasureWifiUpRateValueRaw] * 8000
MinValue=0
MaxValue=750000000
DynamicVariables=1

; Meters

; --- Compute rows + container size "dynamically"
[MeasureRows]
Measure=Calc
Formula=Ceil(#TileCount# / #Columns#)
DynamicVariables=1

[MeasureContainerW]
Measure=Calc
Formula=(#Columns# * #TileW#) + ((#Columns# - 1) * #Gap#) + (2 * #ContainerPad#) + 16
DynamicVariables=1

[MeasureContainerH]
Measure=Calc
Formula=([MeasureRows] * #TileH#) + (([MeasureRows] - 1) * #Gap#) + (2 * #ContainerPad#)
DynamicVariables=1


; Background

[MeterContainerBG]
Meter=Shape
X=#BaseX#
Y=#BaseY#
DynamicVariables=1
Shape=Rectangle 0,0,([MeasureContainerW]),([MeasureContainerH]),12 | Fill Color #BackgroundColour# | StrokeWidth 0


; CPU Graph

[MeterCpuGraphFrame]
Meter=Shape
X=(#BaseX# + #ContainerPad# + (#CpuGraphColumn# * (#TileW# + #Gap#)) + 8)
Y=(#BaseY# + #ContainerPad# + (0 * (#TileH# + #Gap#)) + 8)
Shape=Rectangle 0,0,#TileW#,54,0 | Fill Color 0,0,0,0 | StrokeWidth 1 | Stroke Color #CpuPrimaryColour#

[MeterCpuGraphFill]
Meter=Histogram
MeasureName=MeasureCpuTotalUsageValueRaw
X=(#BaseX# + #ContainerPad# + (#CpuGraphColumn# * (#TileW# + #Gap#)) + 8)
Y=(#BaseY# + #ContainerPad# + (0 * (#TileH# + #Gap#)) + 11)
W=#TileW#
H=50
AntiAlias=1
PrimaryColor=#CpuFillColour#
Hidden=#GraphFillsHidden#

[MeterCpuGraph]
Meter=Line
MeasureName=MeasureCpuTotalUsageValueRaw
X=(#BaseX# + #ContainerPad# + (#CpuGraphColumn# * (#TileW# + #Gap#)) + 8)
Y=(#BaseY# + #ContainerPad# + (0 * (#TileH# + #Gap#)) + 10)
W=#TileW#
H=51
LineWidth=2
AntiAlias=1
LineColor=#CpuPrimaryColour#

[MeterCpuLabel]
Meter=String
X=(#BaseX# + #ContainerPad# + (#CpuGraphColumn# * (#TileW# + #Gap#)) + 12)
Y=(#BaseY# + #ContainerPad# + (0 * (#TileH# + #Gap#)) + 12)
Text=CPU
FontColor=255,255,255,255
AntiAlias=1


; Drive

[MeterDriveGraphFrame]
Meter=Shape
X=(#BaseX# + #ContainerPad# + (#DriveGraphColumn# * (#TileW# + #Gap#)) + 8)
Y=(#BaseY# + #ContainerPad# + (0 * (#TileH# + #Gap#)) + 8)
Shape=Rectangle 0,0,#TileW#,54,0 | Fill Color 0,0,0,0 | StrokeWidth 1 | Stroke Color #DrivePrimaryColour#

[MeterDriveGraphFill]
Meter=Histogram
MeasureName=MeasureSsdTotalUsageValueRaw
X=(#BaseX# + #ContainerPad# + (#DriveGraphColumn# * (#TileW# + #Gap#)) + 8)
Y=(#BaseY# + #ContainerPad# + (0 * (#TileH# + #Gap#)) + 11)
W=#TileW#
H=50
AntiAlias=1
PrimaryColor=#DriveFillColour#
Hidden=#GraphFillsHidden#

[MeterDriveGraph]
